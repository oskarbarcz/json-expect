name: "release"

on:
  push:
    branches: ["main"]

jobs:
  tag:
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Clone repository"
        uses: actions/checkout@v7
      - name: "Release and push git tag"
        run: "git tag $(jq -r '.version' package.json) && git push --tags"
      - name: "Create a GitHub release"
        run: "gh release create $(jq -r '.version' package.json) --generate-notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish-npm:
    needs: tag
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Clone repository"
        uses: actions/checkout@v7
      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: "Install dependencies"
        run: npm ci
      - name: "Publish to npm"
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  publish-github:
    needs: tag
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Clone repository"
        uses: actions/checkout@v7
      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@oskarbarcz"
      - name: "Install dependencies"
        run: npm ci
      - name: "Scope the package for GitHub Packages"
        run: npm pkg set name="@oskarbarcz/json-expect"
      - name: "Publish to GitHub Packages"
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
